<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四年級教學儀表板｜40分鐘三環節</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#334155; --fg:#f1f5f9; --muted:#94a3b8;
    --acc:#38bdf8; --acc2:#f59e0b; --ok:#4ade80; --warn:#fb7185;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--fg); font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif; font-size:20px; line-height:1.6;}
  .wrap{max-width:1000px; margin:0 auto; padding:20px;}
  h1{font-size:2.2rem; text-align:center; margin:20px 0 8px;}
  .sub{text-align:center; color:var(--muted); font-size:1.1rem; margin-bottom:30px;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px;}
  .card{background:var(--card); border-radius:16px; padding:24px; border-left:8px solid var(--acc); cursor:pointer; transition:transform .15s;}
  .card:hover{transform:translateY(-4px);}
  .card .tag{display:inline-block; font-size:.85rem; padding:2px 12px; border-radius:999px; margin-bottom:10px; background:var(--card2); color:var(--acc);}
  .card h2{font-size:1.5rem; margin-bottom:4px;}
  .card .lesson{color:var(--muted); margin-bottom:12px;}
  .card .go{color:var(--acc); font-weight:bold;}
  .timeline{background:var(--card); border-radius:16px; padding:24px; margin:30px 0;}
  .timeline h3{color:var(--acc); margin-bottom:14px;}
  .tl-row{display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px dashed var(--card2);}
  .tl-row:last-child{border-bottom:none;}
  .tl-time{font-size:1.4rem; font-weight:bold; color:var(--acc2); min-width:110px;}
  .tl-name{font-weight:bold;}
  .tl-desc{color:var(--muted); font-size:.95rem;}
  .back{display:inline-block; margin:16px 0; color:var(--acc); text-decoration:none; font-size:1.1rem; font-weight:bold;}
  .lesson-header{background:var(--card); border-radius:16px; padding:20px 24px; margin-bottom:20px;}
  .lesson-header h2{font-size:1.8rem;}
  .lesson-header .meta{color:var(--muted); font-size:1rem; margin-top:4px;}
  .timer-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-bottom:20px;}
  .timer{background:var(--card); border-radius:16px; padding:18px; text-align:center;}
  .timer .name{font-weight:bold; font-size:1.2rem; margin-bottom:6px;}
  .timer .time{font-size:3.2rem; font-weight:bold; font-variant-numeric:tabular-nums; color:var(--acc);}
  .timer .ctrl{margin-top:10px;}
  .timer .ctrl button{font-size:1rem; padding:6px 18px; margin:0 4px; border:none; border-radius:8px; background:var(--card2); color:var(--fg); cursor:pointer;}
  .timer .ctrl button:hover{background:var(--acc); color:#0f172a;}
  .timer.ringing{outline:4px solid var(--acc2);}
  section.block{background:var(--card); border-radius:16px; padding:20px 24px; margin-bottom:20px;}
  section.block h3{font-size:1.4rem; margin-bottom:12px; display:flex; align-items:center; gap:10px;}
  section.block h3 .num{background:var(--acc); color:#0f172a; width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:1.2rem;}
  ul.links{list-style:none;}
  ul.links li{margin:8px 0;}
  ul.links a{color:var(--acc); text-decoration:none; font-size:1.1rem;}
  ul.links a:hover{text-decoration:underline;}
  .note{background:var(--card2); border-radius:10px; padding:12px 16px; margin-top:10px; font-size:.95rem; color:var(--muted);}
  .checklist{list-style:none;}
  .checklist li{margin:8px 0; display:flex; align-items:center; gap:10px;}
  .checklist input{width:22px; height:22px; accent-color:var(--acc);}
  .warn{color:var(--warn); font-weight:bold;}
  .footer{text-align:center; color:var(--muted); font-size:.9rem; margin:30px 0 20px;}
  @media (max-width:600px){
    body{font-size:17px;}
    h1{font-size:1.6rem;}
    .timer .time{font-size:2.4rem;}
    .tl-time{min-width:80px; font-size:1.1rem;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const SECONDS = [600, 900, 900]; // 引起動機10分 解析15分 練習15分
const STEPS = [
  { name:"引起動機", desc:"影片播放 · 連結清單" },
  { name:"重點解析", desc:"課本電子書 · 心智圖" },
  { name:"練習時間", desc:"小白板 · Canva 心智圖 · 生字" }
];

const COURSES = {
  "chinese": {
    tag:"國語 · 翰林版", title:"〈美麗島〉", lesson:"翰林四上 第壹單元 我愛家鄉 · 第1課", author:"楊喚（新詩）",
    motivation:[
      {t:"朗讀影片：美麗島（課文朗讀）", u:"https://www.youtube.com/results?search_query=%E7%BE%8E%E9%BA%97%E5%B3%B6+%E7%BF%B0%E6%9E%97+%E5%9B%9B%E4%B8%8A+%E8%AA%B2%E6%96%87%E6%9C%97%E8%AE%80"},
      {t:"均一教育平台 · 國語文專區", u:"https://www.junyiacademy.org/junyi-chinese"},
      {t:"因材網（登入後選國語四年級）", u:"https://adl.edu.tw/"},
      {t:"學習吧 LearnMode · 四年級課程", u:"https://www.learnmode.net/course_library/2488/fourth-grade"}
    ],
    keypoints:[
      "認識詩人楊喚與〈美麗島〉的新詩特色（押韻、節奏、意象）",
      "從詩句找出臺灣的景物意象：高山、海洋、稻穗等",
      "感受「美麗島」＝我們的家鄉，練習有感情地朗讀",
      "生字：本課生字（如：島、峯、稻、穗等）筆順與部件",
      "句型：堆疊語詞的運用（例：「有的是…有的是…」）"
    ],
    ebook:[
      {t:"翰林書城 · 國語四上（電子書）", u:"https://books.hanlin.com.tw/product/1010071"},
      {t:"翰林國語課文心智圖與生字本下載", u:"https://likethinking.com/blog/ehanlin-40101"}
    ],
    practice:[
      {t:"課本練習題：本課課後練習（朗讀＋生字＋句型）", u:""},
      {t:"小白板問答：『美麗島』裡你聯想到臺灣的哪些景物？", u:""},
      {t:"Canva 心智圖：以「美麗島」為中心畫出詩中景物與感受", u:"https://www.canva.com/zh_tw/" },
      {t:"生字練習：本課生字每個寫 3 次並造詞", u:""}
    ],
    prep:["確認投影與喇叭音量","備好小白板與白板筆（每組1塊）","確認學生 Canva 帳號可登入","下載或開好課文朗讀影片","準備本課生字卡或投影生字表"]
  },
  "math": {
    tag:"數學 · 南一版", title:"一億以內的數", lesson:"南一四上 第1單元",
    motivation:[
      {t:"均一教育平台 · 一億以內的數（類南一版）", u:"https://www.junyiacademy.org/topics/n-m4a"},
      {t:"YouTube：南一數學四上第一單元教學影片", u:"https://www.youtube.com/results?search_query=%E5%8D%97%E4%B8%80+%E6%95%B8%E5%AD%B8+%E5%9B%9B%E4%B8%8A+%E4%B8%80%E5%84%84%E4%BB%A5%E5%85%A7"},
      {t:"因材網（數學四年級單元影片）", u:"https://adl.edu.tw/"},
      {t:"學習吧 LearnMode · 南一四年級", u:"https://www.learnmode.net/course_library/2488/fourth-grade"}
    ],
    keypoints:[
      "認識「億」的位值：億、千萬、百萬、十萬、萬、千、百、十、個",
      "能正確讀寫一億以內的數（含中間有 0 的數）",
      "比較大小：先比位數，再比最高位",
      "認識近似數與「四捨五入」到指定位數",
      "應用：從生活中找出一億以內的數（人口、里程、面積）"
    ],
    ebook:[
      {t:"南一書局官方網站（電子書入口）", u:"https://www.nani.com.tw/"},
      {t:"均一 · 一億以內的數練習題", u:"https://www.junyiacademy.org/topics/n-m4a"}
    ],
    practice:[
      {t:"課本練習題：第1單元課後練習與習作", u:""},
      {t:"小白板問答：『3,050,000』怎麼讀？比大小：99萬 vs 100萬？", u:""},
      {t:"Canva 心智圖：整理一億以內數的位值表與讀寫規則", u:"https://www.canva.com/zh_tw/"},
      {t:"附件：位值表教具操作", u:""}
    ],
    prep:["確認投影與計時器","備好小白板與白板筆","確認學生 Canva 帳號可登入","準備位值表教具或附件","預開均一影片並測試喇叭"]
  },
  "social": {
    tag:"社會 · 康軒版", title:"家鄉在哪裡", lesson:"康軒四上 第壹單元 家鄉的自然環境 · 第1課",
    motivation:[
      {t:"YouTube：康軒社會四上「家鄉在哪裡」教學影片", u:"https://www.youtube.com/results?search_query=%E5%BA%B7%E8%BB%92+%E7%A4%BE%E6%9C%83+%E5%9B%9B%E4%B8%8A+%E5%AE%B6%E9%84%89%E5%9C%A8%E5%93%AA%E8%A3%A1"},
      {t:"均一教育平台（主站，社會資源較少）", u:"https://www.junyiacademy.org/"},
      {t:"因材網（社會四年級）", u:"https://adl.edu.tw/"},
      {t:"學習吧 LearnMode · 康軒四年級", u:"https://www.learnmode.net/course_library/2468/fourth-grade"}
    ],
    keypoints:[
      "認識「家鄉」的定義：出生、成長或長期生活的地方",
      "能在地圖上指出自己的縣市與鄉鎮位置",
      "認識臺灣行政區：6都＋各縣市",
      "從地圖符號讀出位置與方向（上北下南左西右東）",
      "說出自己家鄉的特色（地形、氣候、水資源）"
    ],
    ebook:[
      {t:"康軒文教集團（電子書入口）", u:"https://www.knsh.com.tw/"},
      {t:"康軒各校版本查詢", u:"https://www.knsh.com.tw/service/version"}
    ],
    practice:[
      {t:"課本練習題：第1課課後活動與習作", u:""},
      {t:"小白板問答：『你的家鄉在哪裡？它屬於哪個縣市？』", u:""},
      {t:"Canva 心智圖：以「我的家鄉」為中心畫出位置與特色", u:"https://www.canva.com/zh_tw/"},
      {t:"附件：臺灣行政區拼圖或空白地圖著色", u:""}
    ],
    prep:["確認投影與網路","備好小白板與白板筆","準備臺灣行政區地圖投影","確認學生 Canva 帳號可登入","預開地圖網站或電子地圖"]
  }
};

const LANG_KEYS = { chinese:["chinese","國語","翰林版"], math:["math","數學","南一版"], social:["social","社會","康軒版"] };
let timerStates = [];
let timerInts = [null,null,null];

function h(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderHome(){
  const cards = Object.values(COURSES).map(c => `
    <div class="card" onclick="location.hash='#${c.tag.split(' ')[0]==='國語'?'chinese':c.tag.split(' ')[0]==='數學'?'math':'social'}'">
      <span class="tag">${h(c.tag)}</span>
      <h2>${h(c.title)}</h2>
      <div class="lesson">${h(c.lesson)}</div>
      <span class="go">開啟本課儀表板 →</span>
    </div>`).join("");
  document.getElementById("app").innerHTML = `
    <h1>📚 四年級教學儀表板</h1>
    <div class="sub">每堂 40 分鐘 · 三環節標準流程</div>
    <div class="cards">${cards}</div>
    <div class="timeline">
      <h3>⏱️ 三環節流程（每堂課固定）</h3>
      ${STEPS.map((s,i)=>`
        <div class="tl-row">
          <div class="tl-time">${SECONDS[i]/60} 分鐘</div>
          <div><div class="tl-name">${i+1}. ${s.name}</div><div class="tl-desc">${s.desc}</div></div>
        </div>`).join("")}
    </div>
    <div class="footer">國語·翰林 ／ 數學·南一 ／ 社會·康軒 ｜ 由教師備課使用，教材連結尊重各平台版權</div>`;
}

function renderLesson(key){
  const c = COURSES[key];
  timerStates = SECONDS.map(()=>0);
  timerInts.forEach(t=>clearInterval(t));
  document.getElementById("app").innerHTML = `
    <a class="back" href="#" onclick="location.hash='';return false;">← 回首頁</a>
    <div class="lesson-header">
      <span class="tag">${h(c.tag)}</span>
      <h2>${h(c.title)}</h2>
      <div class="meta">${h(c.lesson)} ${c.author?'· '+h(c.author):''}</div>
    </div>
    <div class="timer-grid">
      ${STEPS.map((s,i)=>`
        <div class="timer" id="timer-${i}">
          <div class="name">${s.name}（${SECONDS[i]/60}分）</div>
          <div class="time" id="time-${i}">${fmt(SECONDS[i])}</div>
          <div class="ctrl">
            <button onclick="toggle(${i})" id="btn-${i}">▶ 開始</button>
            <button onclick="resetTimer(${i})">↺ 重設</button>
          </div>
        </div>`).join("")}
    </div>
    <section class="block">
      <h3><span class="num">1</span>引起動機 · 影片（10 分鐘）</h3>
      <ul class="links">${c.motivation.map(m=>`<li><a href="${h(m.u)}" target="_blank" rel="noopener">▶ ${h(m.t)}</a></li>`).join("")}</ul>
      <div class="note">💡 上課前先開好 1–2 支影片並暫停在開頭；播放時請學生專心觀看，播完用 1–2 題口頭提問引出本課主題。</div>
    </section>
    <section class="block">
      <h3><span class="num">2</span>課本教材重點解析（15 分鐘）</h3>
      <ul class="links">${c.ebook.map(m=>`<li><a href="${h(m.u)}" target="_blank" rel="noopener">📖 ${h(m.t)}</a></li>`).join("")}</ul>
      <ul>${c.keypoints.map(k=>`<li>${h(k)}</li>`).join("")}</ul>
    </section>
    <section class="block">
      <h3><span class="num">3</span>練習時間（15 分鐘）</h3>
      <ul class="links">${c.practice.map((m,i)=>`<li>${m.u?`<a href="${h(m.u)}" target="_blank" rel="noopener">✏️ ${h(m.t)}</a>`:`✏️ ${h(m.t)}`}</li>`).join("")}</ul>
      <div class="note">💡 小白板問答：4 人一組，限時 60 秒作答舉板，各組互評；Canva 心智圖：學生平板開啟並依主題畫出至少 5 個節點。</div>
    </section>
    <section class="block">
      <h3>📋 備課清單（上課前完成）</h3>
      <ul class="checklist">${c.prep.map(p=>`<li><input type="checkbox"> ${h(p)}</li>`).join("")}</ul>
    </section>
    <div class="footer">本頁供投影使用 · 計時器自動依環節順序提醒</div>`;
  renderTimes();
}

function fmt(s){ s=Math.max(0,s); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function renderTimes(){ SECONDS.forEach((_,i)=>{ const el=document.getElementById("time-"+i); if(el) el.textContent = fmt(SECONDS[i]-timerStates[i]); }); }
function tick(i){
  timerStates[i]++;
  const left = SECONDS[i]-timerStates[i];
  const el = document.getElementById("time-"+i);
  if(el) el.textContent = fmt(left);
  if(left<=0){
    clearInterval(timerInts[i]); timerInts[i]=null;
    document.getElementById("btn-"+i).textContent="▶ 開始";
    const box=document.getElementById("timer-"+i);
    box.classList.add("ringing");
    try{ new AudioContext().then?.(()=>{}); }catch(e){}
    beep();
    setTimeout(()=>box.classList.remove("ringing"),4000);
  }
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.4,0.8].forEach(d=>{ const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.001,ctx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.3,ctx.currentTime+d+0.05); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d+0.35);
      o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+0.4); });
  }catch(e){}
}
function toggle(i){
  if(timerInts[i]){ clearInterval(timerInts[i]); timerInts[i]=null; document.getElementById("btn-"+i).textContent="▶ 開始"; }
  else{ timerInts[i]=setInterval(()=>tick(i),1000); document.getElementById("btn-"+i).textContent="⏸ 暫停"; }
}
function resetTimer(i){ clearInterval(timerInts[i]); timerInts[i]=null; timerStates[i]=0; document.getElementById("btn-"+i).textContent="▶ 開始"; renderTimes(); }

function route(){
  const hh = location.hash.replace("#","");
  if(hh==="chinese"||hh==="math"||hh==="social") renderLesson(hh);
  else renderHome();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
